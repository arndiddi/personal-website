[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build (and its credits) when a push only touches hidden drafts or
  # files the site doesn't use. See scripts/netlify-ignore.mjs.
  ignore = "node scripts/netlify-ignore.mjs"

[build.environment]
  NODE_VERSION = "22"

# Long-cache fingerprinted assets (Astro adds a content hash to these filenames).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
